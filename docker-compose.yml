services:
  frontend:
    container_name: FrontendChat_Container
    build: ./FrontendChat
    ports:
      - "5173:5173"
    environment:
      - VITE_SOCKET_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

  backend:
    container_name: BackendChat_Container
    build: ./BackendChat
    ports:
      - "8000:8000"
    environment:
      - FRONTEND_URL=http://localhost:5173
      - REDIS_HOST=redisdb
      - REDIS_PORT=6379
    depends_on:
      - redisdb
    restart: always

  redisdb:
    container_name: RedisDB_Container
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    restart: always
